<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apmāna Mehānika</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }

        .sender-tag {
            background-color: #334155;
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .message-content {
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
            padding: 16px;
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.5;
            min-height: 100px;
            display: flex;
            align-items: center;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-safe {
            background-color: #10b981;
            color: #022c22;
        }

        .btn-scam {
            background-color: #ef4444;
            color: #450a0a;
        }

        .feedback-box {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
            display: none;
        }

        .end-screen {
            display: none;
            text-align: center;
            flex-direction: column;
            gap: 16px;
        }

        .end-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .restart-btn {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Spēles laukums -->
    <div id="playArea" style="display: flex; flex-direction: column; gap: 20px;">
        <div class="top-bar">
            <span class="sender-tag" id="senderName">Sūtītājs</span>
            <span id="progressCounter">1 / 6</span>
        </div>

        <div class="message-content" id="messageText">
            Ielādē ziņu...
        </div>

        <div class="feedback-box" id="feedbackBox"></div>

        <div class="actions" id="actionButtons">
            <button class="btn btn-safe" onclick="makeChoice('safe')">✅ DROŠS</button>
            <button class="btn btn-scam" onclick="makeChoice('scam')">🚨 KRĀPŠANA</button>
        </div>
    </div>

    <!-- Rezultātu laukums -->
    <div class="end-screen" id="endScreen">
        <h2>Spēle pabeigta!</h2>
        <div>Tavs rezultāts:</div>
        <div class="end-score" id="finalScore">0/6</div>
        <button class="restart-btn" onclick="resetGame()">Spēlēt vēlreiz</button>
    </div>
</div>

<script>
    const questions = [
        {
            sender: "Mārcis (CEO)",
            text: "Sveiks! Esmu sanāksmē. Mums steidzami jāpārskaita $3,200 avanss partnerim. Vai vari veikt pārskaitījumu tūlīt?",
            type: "scam",
            explain: "Tā ir krāpšana! Vadītāji neprasa steidzamus finanšu pārskaitījumus sarakstē."
        },
        {
            sender: "Laura (HR)",
            text: "Čau! Lūdzu, iesūti savus atvaļinājuma datumus mūsu iekšējā darba sistēmā.",
            type: "safe",
            explain: "Tas ir droši! Standarta darba komunikācija iekšējā sistēmā."
        },
        {
            sender: "Bankas Atbalsts",
            text: "Brīdinājums: Aizdomīgs darījums (1,200 EUR). Apstipriniet identitāti ar Smart-ID PIN1.",
            type: "scam",
            explain: "Tā ir krāpšana! Banka nekad neprasa PIN kodus caur ziņām."
        },
        {
            sender: "Kārlis (PM)",
            text: "Sveiks! Ieliku kopīgajā Google Drive mapē prezentācijas melnrakstu. Uzmet skatu.",
            type: "safe",
            explain: "Tas ir droši! Parasts darba fails kopīgajā vidē."
        },
        {
            sender: "IT Atbalsts",
            text: "Čau! Šonakt veicam profilaksi. Nosūti man savu paroli, lai saglabātu piekļuvi.",
            type: "scam",
            explain: "Tā ir krāpšana! Paroles nedrīkst izpaust nevienam, pat IT atbalstam."
        },
        {
            sender: "DPD Piegāde",
            text: "Sūtījums aizturēts: apmaksājiet muitas komisiju (1.85 EUR) vietnē http://dpd-fake.com",
            type: "scam",
            explain: "Tā ir krāpšana! Viltota saite ar mērķi izvilināt kartes datus."
        }
    ];

    let currentIndex = 0;
    let points = 0;

    function renderQuestion() {
        const q = questions[currentIndex];
        document.getElementById('senderName').innerText = q.sender;
        document.getElementById('messageText').innerText = `"${q.text}"`;
        document.getElementById('progressCounter').innerText = `${currentIndex + 1} / ${questions.length}`;
        
        const fb = document.getElementById('feedbackBox');
        fb.style.display = 'none';
        
        document.getElementById('actionButtons').style.pointerEvents = 'auto';
        document.getElementById('actionButtons').style.opacity = '1';
    }

    function makeChoice(userChoice) {
        const q = questions[currentIndex];
        const isCorrect = userChoice === q.type;
        
        if (isCorrect) points++;

        const fb = document.getElementById('feedbackBox');
        fb.style.display = 'block';
        fb.style.backgroundColor = isCorrect ? '#064e3b' : '#7f1d1d';
        fb.style.color = isCorrect ? '#6ee7b7' : '#fca5a5';
        fb.innerText = (isCorrect ? '✅ Pareizi! ' : '❌ Nepareizi! ') + q.explain;

        document.getElementById('actionButtons').style.pointerEvents = 'none';
        document.getElementById('actionButtons').style.opacity = '0.5';

        setTimeout(() => {
            currentIndex++;
            if (currentIndex < questions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }, 2000);
    }

    function showResults() {
        document.getElementById('playArea').style.display = 'none';
        document.getElementById('endScreen').style.display = 'flex';
        document.getElementById('finalScore').innerText = `${points} / ${questions.length}`;
    }

    function resetGame() {
        currentIndex = 0;
        points = 0;
        document.getElementById('playArea').style.display = 'flex';
        document.getElementById('endScreen').style.display = 'none';
        renderQuestion();
    }

    // Uzsāk spēli uzreiz
    renderQuestion();
</script>

</body>
</html>
